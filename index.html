<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-MJ Schedule</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for lightweight, reactive frontend logic -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex justify-center antialiased">

    <!-- Main Container (Max width simulates a mobile screen layout) -->
    <div x-data="appState()" class="w-full max-w-md bg-slate-800 shadow-2xl min-h-screen flex flex-col justify-between border-x border-slate-700">
        
        <!-- TOP HEADER & ROLE SWITCHER -->
        <header class="bg-slate-950 p-4 border-b border-slate-700 sticky top-0 z-10">
            <div class="flex justify-between items-center mb-3">
                <h1 class="text-xl font-bold tracking-tight text-emerald-400">Rock-MJ Scheduler</h1>
                <span class="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded border border-slate-700" x-text="currentDateString"></span>
            </div>
            
            <!-- Toggle between Employee view and Manager view -->
            <div class="grid grid-cols-2 gap-2 bg-slate-900 p-1 rounded-lg border border-slate-700 text-sm">
                <button @click="role = 'employee'" :class="role === 'employee' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-slate-400'" class="py-1.5 rounded-md transition-all">
                    Employee View
                </button>
                <button @click="role = 'manager'" :class="role === 'manager' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-slate-400'" class="py-1.5 rounded-md transition-all">
                    Manager Mode
                </button>
            </div>
        </header>

        <!-- HORIZONTAL 7-DAY ROLLING CALENDAR RIBBON -->
        <section class="bg-slate-950/50 p-3 border-b border-slate-800">
            <div class="flex justify-between gap-1 overflow-x-auto pb-1 scrollbar-none">
                <template x-for="day in weekDays" :key="day.dateStr">
                    <button @click="selectedDate = day.dateStr" 
                            :class="selectedDate === day.dateStr ? 'bg-emerald-500 text-slate-950 font-bold transform scale-105' : 'bg-slate-900 text-slate-300 hover:bg-slate-800'"
                            class="flex flex-col items-center flex-1 py-2 px-1 rounded-lg border border-slate-800 transition-all text-center min-w-[48px]">
                        <span class="text-[10px] uppercase tracking-wider opacity-70" x-text="day.name"></span>
                        <span class="text-base font-semibold" x-text="day.dayNum"></span>
                    </button>
                </template>
            </div>
        </section>

        <!-- MAIN UTILITY DISPLAY -->
        <main class="flex-1 p-4 overflow-y-auto space-y-4">
            
            <!-- SECTION: SHIFTS FOR SELECTED DAY -->
            <div>
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2" x-text="'Shifts for ' + formatDisplayDate(selectedDate)"></h2>
                
                <div class="space-y-2">
                    <!-- Dynamic rendering of active shifts -->
                    <template x-for="shift in filteredShifts" :key="shift.id">
                        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex justify-between items-center transition-all">
                            <div>
                                <p class="font-semibold text-slate-100" x-text="shift.employeeName"></p>
                                <p class="text-xs text-slate-400" x-text="shift.role"></p>
                            </div>
                            <div class="text-right">
                                <span class="text-sm font-medium bg-slate-800 px-2.5 py-1 rounded-md text-emerald-400 border border-slate-700" x-text="shift.time"></span>
                            </div>
                        </div>
                    </template>

                    <!-- Fallback UI if zero shifts are scheduled -->
                    <template x-if="filteredShifts.length === 0">
                        <div class="text-center py-6 bg-slate-900/50 rounded-xl border border-dashed border-slate-800 text-slate-500 text-sm">
                            No scheduled shifts for this day.
                        </div>
                    </template>
                </div>
            </div>

            <!-- SECTION: TIME OFF REQUESTS (CONTEXT AWARE) -->
            <div class="pt-2 border-t border-slate-800">
                
                <!-- IF EMPLOYEE: Simple Day Off Submission Form -->
                <template x-if="role === 'employee'">
                    <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 space-y-3">
                        <h3 class="text-sm font-bold text-slate-200">Submit Day Off Request</h3>
                        <div class="space-y-2 text-sm">
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Select Target Date:</label>
                                <input type="date" x-model="newRequestDate" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-slate-100 focus:outline-none focus:border-emerald-500">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Reason / Note:</label>
                                <input type="text" x-model="newRequestNote" placeholder="Doctor appointment, vacation, etc." class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                            </div>
                            <button @click="submitLeaveRequest" class="w-full bg-emerald-500 text-slate-950 font-bold py-2 rounded-lg hover:bg-emerald-400 transition-colors text-center mt-2">
                                Submit Request
                            </button>
                        </div>
                    </div>
                </template>

                <!-- IF MANAGER: Dashboard Review Stack (Like Deputy swipe layout) -->
                <template x-if="role === 'manager'">
                    <div>
                        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Pending Leave Approvals</h3>
                        <div class="space-y-2">
                            <template x-for="req in pendingRequests" :key="req.id">
                                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-3">
                                    <div class="flex justify-between items-start text-sm">
                                        <div>
                                            <p class="font-bold text-slate-200" x-text="req.employeeName"></p>
                                            <p class="text-xs text-slate-400" x-text="'Requested Date: ' + formatDisplayDate(req.date)"></p>
                                            <p class="text-xs text-slate-400 italic mt-1" x-text="'&ldquo;' + req.note + '&rdquo;'"></p>
                                        </div>
                                    </div>
                                    <div class="grid grid-cols-2 gap-2 text-xs">
                                        <button @click="resolveRequest(req.id, 'Denied')" class="bg-slate-800 border border-rose-900/50 text-rose-400 py-1.5 rounded-lg hover:bg-rose-950/30 transition-colors">
                                            Deny
                                        </button>
                                        <button @click="resolveRequest(req.id, 'Approved')" class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 py-1.5 rounded-lg hover:bg-emerald-500/20 font-semibold transition-colors">
                                            Approve
                                        </button>
                                    </div>
                                </div>
                            </template>

                            <template x-if="pendingRequests.length === 0">
                                <div class="text-center py-4 text-xs text-slate-500">
                                    All clear! No pending time-off requests.
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

            </div>
        </main>

        <!-- FOOTER SUMMARY CARDS -->
        <footer class="bg-slate-950 p-4 border-t border-slate-800 text-xs text-slate-400 flex justify-between items-center">
            <div>
                Active View: <span class="text-emerald-400 font-bold uppercase" x-text="role"></span>
            </div>
            <div class="text-slate-500">
                Rock-MJ Engine &bull; Pure Utility
            </div>
        </footer>
    </div>

    <!-- UTILITY APPLICATION STATE & INTERACTIVE LOGIC -->
    <script>
        function appState() {
            return {
                // Core States
                role: 'employee', // 'employee' or 'manager'
                selectedDate: '', // Set programmatically on load
                currentDateString: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                
                // Form Fields
                newRequestDate: '',
                newRequestNote: '',

                // Mock Data Arrays (Acts as the active database state)
                shifts: [
                    { id: 1, employeeName: 'Alex Rivers', date: '', role: 'Floor Supervisor', time: '8:00 AM - 4:00 PM' },
                    { id: 2, employeeName: 'Jordan Taylor', date: '', role: 'Customer Success', time: '10:00 AM - 6:00 PM' },
                    { id: 3, employeeName: 'Casey Morgan', date: '', role: 'Inventory Tech', time: '1:00 PM - 9:00 PM' }
                ],
                
                leaveRequests: [
                    { id: 101, employeeName: 'Jordan Taylor', date: '', note: 'Dentist appointment in morning', status: 'Pending' }
                ],

                // Initialize relative dates dynamically so the app is always functional relative to current day
                init() {
                    const today = new Date();
                    this.selectedDate = today.toISOString().split('T')[0];
                    
                    // Assign default dynamic dates to sample data
                    this.shifts.forEach((s, idx) => {
                        const target = new Date();
                        target.setDate(today.getDate() + (idx % 2)); // Alternates between today and tomorrow
                        s.date = target.toISOString().split('T')[0];
                    });
                    
                    const dayAfterTomorrow = new Date();
                    dayAfterTomorrow.setDate(today.getDate() + 2);
                    this.leaveRequests[0].date = dayAfterTomorrow.toISOString().split('T')[0];
                },

                // Generate array of 7 consecutive days starting from today
                get weekDays() {
                    const days = [];
                    const options = { weekday: 'short' };
                    for (let i = 0; i < 7; i++) {
                        const d = new Date();
                        d.setDate(d.getDate() + i);
                        days.push({
                            name: d.toLocaleDateString('en-US', options),
                            dayNum: d.getDate(),
                            dateStr: d.toISOString().split('T')[0]
                        });
                    }
                    return days;
                },

                // Filter shifts list based on active horizontal calendar selection
                get filteredShifts() {
                    return this.shifts.filter(s => s.date === this.selectedDate);
                },

                // Filter leave items waiting review
                get pendingRequests() {
                    return this.leaveRequests.filter(r => r.status === 'Pending');
                },

                // Employee submissions
                submitLeaveRequest() {
                    if (!this.newRequestDate) return alert('Please pick a valid date.');
                    
                    this.leaveRequests.push({
                        id: Date.now(),
                        employeeName: 'Current User',
                        date: this.newRequestDate,
                        note: this.newRequestNote || 'No note provided',
                        status: 'Pending'
                    });

                    alert('Request submitted to manager dashboard dashboard!');
                    this.newRequestDate = '';
                    this.newRequestNote = '';
                },

                // Manager interaction handler
                resolveRequest(requestId, decision) {
                    const target = this.leaveRequests.find(r => r.id === requestId);
                    if (target) {
                        target.status = decision;
                        
                        // If approved, dynamically inject an interactive placeholder warning shift block 
                        if (decision === 'Approved') {
                            this.shifts.push({
                                id: Date.now(),
                                employeeName: target.employeeName,
                                date: target.date,
                                role: '❌ UNAVAILABLE',
                                time: 'Approved Day Off'
                            });
                        }
                    }
                },

                // Formatting utilities
                formatDisplayDate(dateStr) {
                    if (!dateStr) return '';
                    const parts = dateStr.split('-');
                    const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
                    return dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                }
            }
        }
    </script>
</body>
</html>
