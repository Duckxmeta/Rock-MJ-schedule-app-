<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-MJ Smart Roster Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#0b111e] text-slate-100 min-h-screen antialiased p-0 md:p-6 flex flex-col items-center">

    <div x-data="appState()" class="w-full max-w-6xl bg-[#131b2e] shadow-2xl rounded-2xl border border-white/5 overflow-hidden flex flex-col h-[850px] relative">
        
        <header class="bg-[#090d16] p-4 flex flex-col md:flex-row gap-4 justify-between items-center border-b border-white/5 z-20">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-xl font-bold tracking-tight text-white">Rock-MJ Smart Roster</h1>
                    <span :class="role === 'manager' ? 'bg-indigo-500/20 text-indigo-400 border-indigo-500/30' : 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30'" class="text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 rounded border" x-text="role === 'manager' ? '⚡ Manager' : '🔒 Staff'"></span >
                </div>
                <p class="text-xs text-slate-400 mt-0.5">Deputy Matrix Interface Mode</p>
            </div>

            <div class="flex items-center gap-1.5 bg-black/40 p-1 rounded-xl border border-white/5 text-xs font-bold">
                <button @click="currentLocation = 'Location 1'" :class="currentLocation === 'Location 1' ? 'bg-[#1e293b] text-white border border-white/10' : 'text-slate-400'" class="px-4 py-2 rounded-lg transition">📍 Location 1</button>
                <button @click="currentLocation = 'Location 2'" :class="currentLocation === 'Location 2' ? 'bg-[#1e293b] text-white border border-white/10' : 'text-slate-400'" class="px-4 py-2 rounded-lg transition">📍 Location 2</button>
            </div>

            <div class="flex gap-1 bg-black/20 p-1 rounded-lg text-xs font-medium">
                <button @click="setRoleMode('employee')" :class="role === 'employee' ? 'text-emerald-400 bg-emerald-500/10' : 'text-slate-500'" class="px-3 py-1.5 rounded transition">Employee View</button>
                <button @click="setRoleMode('manager')" :class="role === 'manager' ? 'text-indigo-400 bg-indigo-500/10' : 'text-slate-500'" class="px-3 py-1.5 rounded transition">🔑 Rock & MJ Mode</button>
            </div>
        </header>

        <section class="bg-[#162035] px-6 py-3 border-b border-white/5 flex justify-between items-center text-xs font-bold">
            <div class="flex items-center gap-2">
                <button @click="shiftWeek(-7)" class="p-2 rounded bg-black/20 border border-white/5 hover:bg-black/40 text-slate-300 transition">◀</button>
                <span class="uppercase tracking-wider text-slate-300 text-sm font-semibold px-2" x-text="getWeekRangeLabel()"></span>
                <button @click="shiftWeek(7)" class="p-2 rounded bg-black/20 border border-white/5 hover:bg-black/40 text-slate-300 transition">▶</button>
            </div>
            <span class="text-slate-400" x-text="'Today: ' + currentDateString"></span>
        </section>

        <main class="flex-1 overflow-auto bg-[#0f172a] scrollbar-none">
            <table class="w-full border-collapse text-left min-w-[900px]">
                <thead>
                    <tr class="bg-[#161f33] border-b border-white/5 text-slate-400 text-[11px] uppercase tracking-wider font-bold">
                        <th class="p-4 w-[220px] sticky left-0 bg-[#161f33] border-r border-white/5 shadow-md z-10">Team Roster Member</th>
                        <template x-for="day in weekDays" :key="day.dateStr">
                            <th class="p-4 text-center border-r border-white/5 min-w-[130px]">
                                <div class="text-white font-bold" x-text="day.name"></div>
                                <div class="text-slate-400 font-medium text-xs mt-0.5" x-text="day.dayNum"></div>
                            </th>
                        </template>
                    </tr>
                </thead>
                <tbody class="divide-y divide-white/5 text-xs">
                    <template x-for="emp in employees" :key="emp.id">
                        <tr class="hover:bg-white/[0.01] transition">
                            <td class="p-4 font-semibold text-slate-200 sticky left-0 bg-[#0f172a] border-r border-white/5 shadow-md z-10">
                                <div class="flex flex-col gap-1 group">
                                    <div class="flex justify-between items-center">
                                        <span class="truncate text-sm font-bold text-white" x-text="emp.name"></span>
                                        <template x-if="role === 'manager'">
                                            <button @click="removeEmployee(emp.id)" class="text-slate-600 hover:text-rose-400 font-bold opacity-0 group-hover:opacity-100 transition text-sm px-1">×</button>
                                        </template>
                                    </div>
                                    <div class="mt-1">
                                        <span class="bg-indigo-950/60 text-indigo-400 border border-indigo-500/20 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">
                                            ⏱️ <span x-text="calculateWeeklyHours(emp.name)"></span> hrs/wk
                                        </span>
                                    </div>
                                </div>
                            </td>
                            
                            <template x-for="day in weekDays" :key="day.dateStr">
                                <td class="p-2 border-r border-white/5 align-top text-center h-24 bg-black/5">
                                    <div class="flex flex-col gap-1 h-full justify-center items-center">
                                        <template x-for="shift in getCellShifts(emp.name, day.dateStr)" :key="shift.id">
                                            <div :class="shift.role.includes('❌') ? 'bg-rose-500/10 text-rose-400 border-rose-500/20' : 'bg-indigo-500/10 text-indigo-300 border-indigo-500/20'" class="w-full p-2 rounded-lg border text-left flex flex-col justify-between shadow-sm relative group/shift">
                                                
                                                <template x-if="role === 'manager'">
                                                    <button @click="deleteShift(shift.id)" class="absolute top-1 right-1 w-5 h-5 bg-rose-950/80 text-rose-400 border border-rose-500/30 rounded flex items-center justify-center opacity-0 group-hover/shift:opacity-100 transition hover:bg-rose-900 hover:text-white font-bold text-[10px]" title="Delete Shift">
                                                        🗑️
                                                    </button>
                                                </template>

                                                <div class="font-bold text-[11px] tracking-wide truncate pr-4" x-text="shift.time"></div>
                                                <div class="text-[10px] text-slate-400 truncate mt-0.5 font-medium uppercase tracking-tight" x-text="shift.role"></div>
                                            </div>
                                        </template>
                                        <template x-if="getCellShifts(emp.name, day.dateStr).length === 0">
                                            <span class="text-[10px] text-slate-600 font-medium tracking-wide select-none">-</span>
                                        </template>
                                    </div>
                                </td>
                            </template>
                        </tr>
                    </template>
                    
                    <template x-if="employees.length === 0">
                        <tr>
                            <td colspan="8" class="p-12 text-center text-slate-500 italic text-xs">
                                No roster members loaded. Access Rock & MJ Mode below to add staff records.
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </main>

        <footer class="bg-[#090d16] p-4 border-t border-white/5 z-20">
            <template x-if="role === 'employee'">
                <div class="flex flex-col md:flex-row items-center gap-4 justify-between bg-white/[0.02] border border-white/5 p-3.5 rounded-xl">
                    <div class="text-left">
                        <h4 class="text-xs font-bold text-slate-200 uppercase tracking-wider">Submit Absence Request</h4>
                        <p class="text-[10px] text-slate-400">Routes to Rock & MJ's pending desktop queue.</p>
                    </div>
                    <div class="flex flex-wrap items-center gap-2 w-full md:w-auto text-xs">
                        <select x-model="selectedEmployeeForRequest" class="bg-black/40 border border-white/10 rounded-lg p-2 text-white text-xs min-w-[160px]">
                            <option value="">Who are you?</option>
                            <template x-for="emp in employees" :key="emp.id">
                                <option :value="emp.name" x-text="emp.name"></option>
                            </template>
                        </select>
                        <input type="date" x-model="newRequestDate" class="bg-black/40 border border-white/10 rounded-lg p-2 text-white text-xs">
                        <input type="text" x-model="newRequestNote" placeholder="Note (Vacation...)" class="bg-black/40 border border-white/10 rounded-lg p-2 text-white text-xs max-w-[140px]">
                        <button @click="submitLeaveRequest" class="bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs transition">Send Request</button>
                    </div>
                </div>
            </template>

            <template x-if="role === 'manager'">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-white/[0.02] border border-white/5 p-3.5 rounded-xl space-y-2">
                        <div class="flex justify-between items-center">
                            <h4 class="text-xs font-bold text-slate-200 uppercase tracking-wider">📋 Add Team Member</h4>
                            <button @click="lockManagerMode" class="text-[9px] bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2 py-0.5 rounded">Exit Admin Mode</button>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" x-model="newEmployeeName" @keydown.enter="addEmployee" placeholder="Type Employee Name..." class="flex-1 bg-black/40 border border-white/10 rounded-lg px-3 py-1.5 text-xs text-white">
                            <button @click="addEmployee" class="bg-indigo-500 text-white font-bold px-4 py-1.5 rounded-lg text-xs hover:bg-indigo-400">Add</button>
                        </div>
                    </div>
                    <div class="bg-white/[0.02] border border-white/5 p-3.5 rounded-xl space-y-2">
                        <h4 class="text-xs font-bold text-slate-200 uppercase tracking-wider">➕ Assign Roster Shift</h4>
                        <div class="grid grid-cols-4 gap-1.5 text-xs">
                            <select x-model="mngEmpName" class="bg-black/40 border border-white/10 rounded-md p-1.5 text-white">
                                <option value="">Employee</option>
                                <template x-for="emp in employees" :key="emp.id">
                                    <option :value="emp.name" x-text="emp.name"></option>
                                </template>
                            </select>
                            <input type="text" x-model="mngRole" placeholder="Role" class="bg-black/40 border border-white/10 rounded-md p-1.5 text-white">
                            <input type="text" x-model="mngTime" placeholder="Hours (e.g. 8am-4pm)" class="bg-black/40 border border-white/10 rounded-md p-1.5 text-white">
                            <input type="date" x-model="mngDate" class="bg-black/40 border border-white/10 rounded-md p-1.5 text-white">
                        </div>
                        <button @click="createCustomShift" class="w-full bg-indigo-500 text-white font-bold py-1.5 rounded-lg text-xs mt-1 hover:bg-indigo-400">Save Shift Entry</button>
                    </div>
                </div>
            </template>
        </footer>

        <template x-if="role === 'manager' && pendingRequests.length > 0">
            <div class="absolute bottom-24 right-4 max-w-sm w-full bg-slate-900 border border-amber-500/20 rounded-xl p-4 shadow-2xl space-y-3 z-30">
                <div class="flex justify-between items-center">
                    <h5 class="text-xs font-bold text-amber-400 uppercase tracking-wider">⚠️ Pending Time-Off Feed</h5>
                    <span class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded font-bold" x-text="pendingRequests.length"></span>
                </div>
                <div class="max-h-36 overflow-y-auto space-y-2 pr-1 scrollbar-none">
                    <template x-for="req in pendingRequests" :key="req.id">
                        <div class="bg-black/30 border border-white/5 p-2.5 rounded-lg text-xs space-y-1.5">
                            <div class="flex justify-between font-bold text-white">
                                <span x-text="req.employeeName"></span>
                                <span class="text-slate-400 text-[10px]" x-text="req.location"></span>
                            </div>
                            <p class="text-[11px] text-indigo-400" x-text="'Date: ' + formatDisplayDate(req.date)"></p>
                            <p class="text-slate-400 italic text-[11px]" x-text="'&ldquo;' + req.note + '&rdquo;'"></p>
                            <div class="grid grid-cols-2 gap-1.5 pt-1">
                                <button @click="resolveRequest(req.id, 'Denied')" class="bg-rose-500/20 text-rose-400 py-1 rounded font-medium">Deny</button>
                                <button @click="resolveRequest(req.id, 'Approved')" class="bg-emerald-500 text-black py-1 font-bold rounded">Approve</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <div x-show="showAuthModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4" x-transition>
            <div class="bg-slate-900 border border-white/10 w-full max-w-xs rounded-2xl p-6 text-center space-y-4 shadow-2xl">
                <div class="w-12 h-12 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full flex items-center justify-center mx-auto text-xl font-bold">🔒</div>
                <div>
                    <h3 class="text-base font-bold text-white">Management Verification</h3>
                    <p class="text-xs text-slate-400 mt-1">Please enter the passcode to access scheduling controls.</p>
                </div>
                <input type="password" x-model="authInput" @keydown.enter="verifyPasscode" placeholder="••••" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-center tracking-widest text-lg text-white focus:outline-none focus:border-indigo-500">
                <div class="grid grid-cols-2 gap-2 text-xs font-semibold">
                    <button @click="cancelAuthModal" class="bg-white/5 text-slate-300 py-2.5 rounded-xl border border-white/5">Cancel</button>
                    <button @click="verifyPasscode" class="bg-indigo-500 text-white py-2.5 rounded-xl shadow-md">Unlock</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        function appState() {
            return {
                role: 'employee',
                currentLocation: 'Location 1',
                weekOffset: 0,
                currentDateString: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                
                showAuthModal: false,
                authInput: '',
                masterPasscode: '1234', // <-- ROCK & MJ ACCESS PASSWORD SIGNATURE

                newEmployeeName: '', selectedEmployeeForRequest: '',
                newRequestDate: '', newRequestNote: '',
                mngEmpName: '', mngRole: '', mngTime: '', mngDate: '',

                employees: [], shifts: [], leaveRequests: [],

                init() {
                    this.mngDate = new Date().toISOString().split('T')[0];
                    this.employees = JSON.parse(localStorage.getItem('rmj_employees_v5')) || [];
                    this.shifts = JSON.parse(localStorage.getItem('rmj_shifts_v5')) || [];
                    this.leaveRequests = JSON.parse(localStorage.getItem('rmj_leave_v5')) || [];
                },

                saveEmployees() { localStorage.setItem('rmj_employees_v5', JSON.stringify(this.employees)); },
                saveShifts() { localStorage.setItem('rmj_shifts_v5', JSON.stringify(this.shifts)); },
                saveLeave() { localStorage.setItem('rmj_leave_v5', JSON.stringify(this.leaveRequests)); },

                setRoleMode(mode) {
                    if (mode === 'employee') { this.role = 'employee'; } 
                    else if (mode === 'manager') {
                        if (this.role === 'manager') return;
                        this.authInput = ''; this.showAuthModal = true;
                    }
                },
                verifyPasscode() {
                    if (this.authInput === this.masterPasscode) { this.role = 'manager'; this.showAuthModal = false; } 
                    else { alert('Access Denied.'); this.authInput = ''; }
                },
                cancelAuthModal() { this.showAuthModal = false; },
                lockManagerMode() { this.role = 'employee'; },

                addEmployee() {
                    if (!this.newEmployeeName.trim()) return;
                    this.employees.push({ id: Date.now(), name: this.newEmployeeName.trim() });
                    this.saveEmployees(); this.newEmployeeName = '';
                },
                removeEmployee(id) {
                    if(confirm("Remove this staff record from the roster database?")) {
                        this.employees = this.employees.filter(e => e.id !== id);
                        this.saveEmployees();
                    }
                },

                shiftWeek(days) { this.weekOffset += days; },
                getWeekRangeLabel() {
                    const d = new Date(); d.setDate(d.getDate() + this.weekOffset - d.getDay() + 1);
                    const end = new Date(d); end.setDate(end.getDate() + 6);
                    return d.toLocaleDateString('en-US', {month:'short', day:'numeric'}) + ' - ' + end.toLocaleDateString('en-US', {month:'short', day:'numeric'});
                },
                get weekDays() {
                    const days = [];
                    const current = new Date();
                    const dayOfWeek = current.getDay();
                    const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek; 
                    
                    for (let i = 0; i < 7; i++) {
                        const d = new Date();
                        d.setDate(d.getDate() + mondayOffset + this.weekOffset + i);
                        days.push({ name: d.toLocaleDateString('en-US', { weekday: 'short' }), dayNum: d.getDate(), dateStr: d.toISOString().split('T')[0] });
                    }
                    return days;
                },

                getCellShifts(empName, dateStr) {
                    return this.shifts.filter(s => s.employeeName === empName && s.date === dateStr && s.location === this.currentLocation);
                },
                get pendingRequests() { return this.leaveRequests.filter(r => r.status === 'Pending'); },

                // DELETE SHIFT HANDLER FOR MANAGERS
                deleteShift(shiftId) {
                    if(confirm("Are you sure you want to completely remove this shift?")) {
                        this.shifts = this.shifts.filter(s => s.id !== shiftId);
                        this.saveShifts();
                    }
                },

                // MATHEMATICAL ENGINE TO AUTO-EXTRACT HOURS OUT OF TEXT
                calculateWeeklyHours(empName) {
                    let totalHours = 0;
                    const days = this.weekDays;
                    
                    // Filter shifts strictly tied to this employee, location, and the visible 7 days
                    const activeShifts = this.shifts.filter(s => 
                        s.employeeName === empName && 
                        s.location === this.currentLocation &&
                        days.some(d => d.dateStr === s.date)
                    );

                    activeShifts.forEach(shift => {
                        let timeStr = shift.time.toLowerCase().replace(/\s+/g, '');
                        
                        // Ignore leave tags
                        if (shift.role.includes('❌') || timeStr === 'off' || timeStr === 'unavailable') return;

                        // Case A: Simple raw numeric values like "8" or "7.5"
                        if (!isNaN(timeStr) && timeStr !== '') {
                            totalHours += parseFloat(timeStr);
                            return;
                        }

                        // Case B: Time range extraction (e.g., "8am-4pm")
                        if (timeStr.includes('-') || timeStr.includes('to')) {
                            const parts = timeStr.split(/-|to/);
                            if (parts.length === 2) {
                                let start = this.parseTimeValue(parts[0]);
                                let end = this.parseTimeValue(parts[1]);
                                if (start !== null && end !== null) {
                                    let diff = end - start;
                                    if (diff < 0) diff += 24; // Handle overnight shifts cleanly
                                    totalHours += diff;
                                }
                            }
                        }
                    });

                    return totalHours % 1 === 0 ? totalHours : totalHours.toFixed(1);
                },

                parseTimeValue(str) {
                    // Extract match coordinates out of standard clock strings
                    const match = str.match(/^(\d+)(?::(\d+))?(am|pm)?$/);
                    if (!match) return null;

                    let hours = parseInt(match[1]);
                    let minutes = match[2] ? parseInt(match[2]) : 0;
                    let ampm = match[3];

                    if (ampm === 'pm' && hours < 12) hours += 12;
                    if (ampm === 'am' && hours === 12) hours = 0;

                    return hours + (minutes / 60);
                },

                submitLeaveRequest() {
                    if (!this.selectedEmployeeForRequest || !this.newRequestDate) return alert('Fill required parameters.');
                    this.leaveRequests.push({
                        id: Date.now(), employeeName: this.selectedEmployeeForRequest, date: this.newRequestDate,
                        note: this.newRequestNote || 'Time Off Request', location: this.currentLocation, status: 'Pending'
                    });
                    this.saveLeave(); alert('Request logged to managers.');
                    this.selectedEmployeeForRequest = ''; this.newRequestDate = ''; this.newRequestNote = '';
                },
                createCustomShift() {
                    if (!this.mngEmpName || !this.mngRole || !this.mngTime || !this.mngDate) return alert('Complete all fields.');
                    this.shifts.push({ id: Date.now(), employeeName: this.mngEmpName, role: this.mngRole, time: this.mngTime, date: this.mngDate, location: this.currentLocation });
                    this.saveShifts();
                    this.mngEmpName = ''; this.mngRole = ''; this.mngTime = '';
                },
                resolveRequest(requestId, decision) {
                    const target = this.leaveRequests.find(r => r.id === requestId);
                    if (target) {
                        target.status = decision;
                        if (decision === 'Approved') {
                            this.shifts.push({ id: Date.now(), employeeName: target.employeeName, date: target.date, role: '❌ APPROVED LEAVE', time: 'OFF', location: target.location });
                            this.saveShifts();
                        }
                        this.saveLeave();
                    }
                },
                formatDisplayDate(dateStr) {
                    const parts = dateStr.split('-');
                    return new Date(parts[0], parts[1] - 1, parts[2]).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                }
            }
        }
    </script>
</body>
</html>
