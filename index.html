<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-MJ Secure Roster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#090d16] via-[#020617] to-[#111029] text-slate-100 min-h-screen flex justify-center antialiased p-0 sm:p-4">

    <div x-data="appState()" class="w-full max-w-md bg-slate-900/50 backdrop-blur-2xl shadow-2xl min-h-screen sm:min-h-[885px] sm:rounded-3xl flex flex-col justify-between border border-white/10 overflow-hidden relative">
        
        <div class="absolute top-[-5%] right-[-10%] w-64 h-64 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute top-[20%] left-[-25%] w-72 h-72 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <header class="bg-slate-950/80 backdrop-blur-lg p-5 border-b border-white/5 sticky top-0 z-20 space-y-3.5">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Rock-MJ Scheduler</h1>
                    <div class="flex items-center gap-1.5 mt-0.5">
                        <span :class="role === 'manager' ? 'bg-indigo-400' : 'bg-emerald-400'" class="w-1.5 h-1.5 rounded-full animate-pulse"></span>
                        <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400" x-text="role === 'manager' ? '⚡ Rock & MJ Active Session' : '🔒 Secure Staff Portal'"></p>
                    </div>
                </div>
                <span class="text-xs bg-white/5 border border-white/10 px-2.5 py-1 rounded-full text-slate-400 font-medium" x-text="currentDateString"></span>
            </div>

            <div class="grid grid-cols-2 gap-1 bg-black/50 p-1 rounded-xl border border-white/5 text-xs font-bold">
                <button @click="currentLocation = 'Location 1'" :class="currentLocation === 'Location 1' ? 'bg-gradient-to-b from-white/15 to-white/5 text-white border border-white/10 shadow-md' : 'text-slate-400 hover:text-slate-200'" class="py-2 rounded-lg transition-all">
                    📍 Location 1
                </button>
                <button @click="currentLocation = 'Location 2'" :class="currentLocation === 'Location 2' ? 'bg-gradient-to-b from-white/15 to-white/5 text-white border border-white/10 shadow-md' : 'text-slate-400 hover:text-slate-200'" class="py-2 rounded-lg transition-all">
                    📍 Location 2
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-1 bg-black/30 p-1 rounded-lg text-[11px] font-semibold">
                <button @click="setRoleMode('employee')" :class="role === 'employee' ? 'text-emerald-400 bg-emerald-500/10 border border-emerald-500/20' : 'text-slate-500'" class="py-1 rounded-md border border-transparent transition-all">
                    Employee View
                </button>
                <button @click="setRoleMode('manager')" :class="role === 'manager' ? 'text-indigo-400 bg-indigo-500/10 border border-indigo-500/20' : 'text-slate-500'" class="py-1 rounded-md border border-transparent transition-all">
                    🔑 Rock & MJ Mode
                </button>
            </div>
        </header>

        <section class="bg-black/10 p-4 border-b border-white/5 space-y-3">
            <div class="flex justify-between items-center text-xs font-bold tracking-wider text-slate-400">
                <button @click="shiftWeek(-7)" class="p-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/5 text-slate-300 transition">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <span class="uppercase font-bold text-slate-300" x-text="getWeekRangeLabel()"></span>
                <button @click="shiftWeek(7)" class="p-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/5 text-slate-300 transition">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"/></svg>
                </button>
            </div>

            <div class="flex justify-between gap-1.5 overflow-x-auto pb-1 scrollbar-none">
                <template x-for="day in weekDays" :key="day.dateStr">
                    <button @click="selectedDate = day.dateStr" 
                            :class="selectedDate === day.dateStr ? 'bg-white/10 text-emerald-400 border-emerald-500/40 shadow-xl shadow-emerald-950/20' : 'bg-white/[0.01] text-slate-400 border-white/5 hover:bg-white/5'"
                            class="flex flex-col items-center flex-1 py-2.5 rounded-xl border transition-all text-center min-w-[46px]">
                        <span class="text-[9px] font-bold uppercase tracking-widest opacity-60 mb-0.5" x-text="day.name"></span>
                        <span class="text-sm font-bold" x-text="day.dayNum"></span>
                    </button>
                </template>
            </div>
        </section>

        <main class="flex-1 p-4 overflow-y-auto space-y-5 z-10">
            
            <div>
                <div class="flex justify-between items-center mb-2.5">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest" x-text="currentLocation + ' • ' + formatDisplayDate(selectedDate)"></h2>
                    <span class="text-[10px] bg-white/5 text-slate-300 border border-white/10 px-2 py-0.5 rounded-full font-medium" x-text="filteredShifts.length + ' Shifts'"></span>
                </div>
                
                <div class="space-y-2">
                    <template x-for="shift in filteredShifts" :key="shift.id">
                        <div :class="shift.role.includes('❌') ? 'border-rose-500/20 bg-rose-950/10' : 'border-white/5 bg-white/[0.03]'" class="p-3.5 rounded-xl border backdrop-blur-md flex justify-between items-center transition-all">
                            <div>
                                <p class="font-semibold text-white text-sm tracking-wide" x-text="shift.employeeName"></p>
                                <p class="text-[11px] text-slate-400 mt-0.5" x-text="shift.role"></p>
                            </div>
                            <div>
                                <span :class="shift.role.includes('❌') ? 'bg-rose-500/10 text-rose-400 border-rose-500/20' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'" class="text-xs font-medium px-2.5 py-1 rounded-lg border" x-text="shift.time"></span>
                            </div>
                        </div>
                    </template>

                    <template x-if="filteredShifts.length === 0">
                        <div class="text-center py-6 bg-white/[0.01] rounded-xl border border-dashed border-white/5 text-slate-500 text-xs">
                            No active entries assigned to this facility date.
                        </div>
                    </template>
                </div>
            </div>

            <div class="pt-4 border-t border-white/5">
                
                <template x-if="role === 'employee'">
                    <div class="bg-white/[0.02] border border-white/5 p-4 rounded-xl space-y-3.5 shadow-inner">
                        <div>
                            <h3 class="text-sm font-bold text-slate-200">Submit Time Off Request</h3>
                            <p class="text-[10px] text-slate-400 mt-0.5">Logs straight to Rock & MJ's pending approval list.</p>
                        </div>
                        <div class="space-y-2.5 text-xs">
                            <div class="grid grid-cols-1 gap-1">
                                <label class="text-slate-400 font-medium pl-0.5">Select Your Name</label>
                                <select x-model="selectedEmployeeForRequest" class="w-full bg-black/40 border border-white/10 rounded-xl p-2.5 text-white focus:outline-none focus:border-emerald-500/50 text-sm">
                                    <option value="" class="bg-slate-900">-- Click to pick profile --</option>
                                    <template x-for="emp in employees" :key="emp.id">
                                        <option :value="emp.name" class="bg-slate-900" x-text="emp.name"></option>
                                    </template>
                                </select>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div class="flex flex-col gap-1">
                                    <label class="text-slate-400 font-medium pl-0.5">Date Off</label>
                                    <input type="date" x-model="newRequestDate" class="bg-black/40 border border-white/10 rounded-xl p-2.5 text-white text-xs">
                                </div>
                                <div class="flex flex-col gap-1">
                                    <label class="text-slate-400 font-medium pl-0.5">Optional Note</label>
                                    <input type="text" x-model="newRequestNote" placeholder="Trip, appointment..." class="bg-black/40 border border-white/10 rounded-xl p-2.5 text-white placeholder-slate-600 text-xs">
                                </div>
                            </div>
                            <button @click="submitLeaveRequest" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs mt-1 transition-all shadow-lg shadow-emerald-950/30">
                                Send Request to Management
                            </button>
                        </div>
                    </div>
                </template>

                <template x-if="role === 'manager'">
                    <div class="space-y-4">
                        
                        <div class="bg-white/[0.02] border border-white/5 p-4 rounded-xl space-y-3">
                            <div class="flex justify-between items-center">
                                <h3 class="text-xs font-bold text-slate-200 uppercase tracking-wider">📋 Manage Team Roster</h3>
                                <button @click="lockManagerMode" class="text-[10px] bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2 py-0.5 rounded-md font-medium">Log Out Admin</button>
                            </div>
                            <div class="flex gap-2">
                                <input type="text" x-model="newEmployeeName" placeholder="Type Employee Name..." class="flex-1 bg-black/40 border border-white/10 rounded-lg px-3 py-1.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500">
                                <button @click="addEmployee" class="bg-indigo-500 hover:bg-indigo-400 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition">
                                    Add Staff
                                </button>
                            </div>
                            <div class="flex flex-wrap gap-1.5 pt-1">
                                <template x-for="emp in employees" :key="emp.id">
                                    <span class="inline-flex items-center gap-1 text-[11px] bg-white/5 border border-white/10 rounded-md pl-2 pr-1 py-0.5 text-slate-300">
                                        <span x-text="emp.name"></span>
                                        <button @click="removeEmployee(emp.id)" class="text-slate-500 hover:text-rose-400 font-bold px-1">×</button>
                                    </span>
                                </template>
                            </div>
                        </div>

                        <div class="bg-white/[0.02] border border-white/5 p-4 rounded-xl space-y-3">
                            <h3 class="text-xs font-bold text-slate-200 uppercase tracking-wider">➕ Create Schedule Entry</h3>
                            <div class="space-y-2 text-xs">
                                <div class="grid grid-cols-2 gap-2">
                                    <select x-model="mngEmpName" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-white focus:outline-none">
                                        <option value="">Select Employee</option>
                                        <template x-for="emp in employees" :key="emp.id">
                                            <option :value="emp.name" x-text="emp.name"></option>
                                        </template>
                                    </select>
                                    <input type="text" x-model="mngRole" placeholder="Role (e.g. Server)" class="bg-black/40 border border-white/10 rounded-lg p-2 text-white placeholder-slate-600">
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="text" x-model="mngTime" placeholder="Hours (e.g. 9am - 5pm)" class="bg-black/40 border border-white/10 rounded-lg p-2 text-white placeholder-slate-600">
                                    <input type="date" x-model="mngDate" class="bg-black/40 border border-white/10 rounded-lg p-2 text-white">
                                </div>
                                <button @click="createCustomShift" class="w-full bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-bold py-2 rounded-xl text-xs shadow-md transition-all">
                                    Save Shift to Active Facility
                                </button>
                            </div>
                        </div>

                        <div>
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5">Pending Absence File Line</h3>
                            <div class="space-y-2">
                                <template x-for="req in pendingRequests" :key="req.id">
                                    <div class="bg-white/[0.02] border border-white/5 p-3.5 rounded-xl space-y-2.5">
                                        <div class="text-xs">
                                            <div class="flex justify-between items-center">
                                                <p class="font-bold text-slate-200 text-sm" x-text="req.employeeName"></p>
                                                <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-md font-medium text-[10px]" x-text="req.location"></span>
                                            </div>
                                            <p class="text-[11px] text-indigo-400 font-semibold mt-0.5" x-text="'Requested Date: ' + formatDisplayDate(req.date)"></p>
                                            <p class="text-xs text-slate-400 italic mt-1 bg-black/20 p-2 rounded-lg border border-white/5" x-text="'&ldquo;' + req.note + '&rdquo;'"></p>
                                        </div>
                                        <div class="grid grid-cols-2 gap-2 text-xs">
                                            <button @click="resolveRequest(req.id, 'Denied')" class="bg-white/5 border border-rose-500/20 text-rose-400 py-1.5 rounded-lg font-medium transition">
                                                Deny
                                            </button>
                                            <button @click="resolveRequest(req.id, 'Approved')" class="bg-emerald-500 text-slate-950 py-1.5 rounded-lg font-bold transition">
                                                Approve
                                            </button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                    </div>
                </template>
            </div>
        </main>

        <div x-show="showAuthModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4" x-transition>
            <div class="bg-slate-900 border border-white/10 w-full max-w-xs rounded-2xl p-6 text-center space-y-4 shadow-2xl">
                <div class="w-12 h-12 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full flex items-center justify-center mx-auto text-xl font-bold">🔒</div>
                <div>
                    <h3 class="text-base font-bold text-white">Management Verification</h3>
                    <p class="text-xs text-slate-400 mt-1">Please insert the private operational passcode to unlock dashboard privileges.</p>
                </div>
                <input type="password" x-model="authInput" placeholder="••••" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-center tracking-widest text-lg text-white focus:outline-none focus:border-indigo-500">
                <div class="grid grid-cols-2 gap-2 text-xs font-semibold">
                    <button @click="cancelAuthModal" class="bg-white/5 text-slate-300 py-2.5 rounded-xl border border-white/5">Cancel</button>
                    <button @click="verifyPasscode" class="bg-indigo-500 text-white py-2.5 rounded-xl shadow-lg shadow-indigo-950/50">Unlock</button>
                </div>
            </div>
        </div>

        <footer class="bg-slate-950/90 backdrop-blur-lg p-4 border-t border-white/5 text-[10px] text-slate-500 flex justify-between items-center z-20">
            <div>Active Context: <span class="text-slate-300 font-bold" x-text="currentLocation"></span></div>
            <div class="font-medium tracking-wide">Rock-MJ Secure Shield v3</div>
        </footer>
    </div>

    <script>
        function appState() {
            return {
                role: 'employee',
                currentLocation: 'Location 1',
                selectedDate: '',
                weekOffset: 0,
                currentDateString: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                
                // Security Gates
                showAuthModal: false,
                authInput: '',
                masterPasscode: '1234', // <-- CHANGE THIS PIN SIGNATURE AS NEEDED FOR ROCK & MJ

                // Form Blocks
                newEmployeeName: '', selectedEmployeeForRequest: '',
                newRequestDate: '', newRequestNote: '',
                mngEmpName: '', mngRole: '', mngTime: '', mngDate: '',

                employees: [], shifts: [], leaveRequests: [],

                init() {
                    const today = new Date();
                    this.selectedDate = today.toISOString().split('T')[0];
                    this.mngDate = this.selectedDate;

                    // Hydration Protocols
                    if (localStorage.getItem('rmj_employees_v3')) {
                        this.employees = JSON.parse(localStorage.getItem('rmj_employees_v3'));
                    } else {
                        // Base initialization if memory file is missing
                        this.employees = [{ id: 1, name: 'Alex Rivers' }, { id: 2, name: 'Casey Morgan' }];
                        this.saveEmployees();
                    }
                    this.shifts = JSON.parse(localStorage.getItem('rmj_shifts_v3')) || [];
                    this.leaveRequests = JSON.parse(localStorage.getItem('rmj_leave_v3')) || [];
                },

                saveEmployees() { localStorage.setItem('rmj_employees_v3', JSON.stringify(this.employees)); },
                saveShifts() { localStorage.setItem('rmj_shifts_v3', JSON.stringify(this.shifts)); },
                saveLeave() { localStorage.setItem('rmj_leave_v3', JSON.stringify(this.leaveRequests)); },

                // SECURITY GATE LOGIC ENGINE
                setRoleMode(mode) {
                    if (mode === 'employee') {
                        this.role = 'employee';
                    } else if (mode === 'manager') {
                        if (this.role === 'manager') return; // Already verified
                        this.authInput = '';
                        this.showAuthModal = true;
                    }
                },
                verifyPasscode() {
                    if (this.authInput === this.masterPasscode) {
                        this.role = 'manager';
                        this.showAuthModal = false;
                    } else {
                        alert('Access Denied: Invalid Authentication Signature.');
                        this.authInput = '';
                    }
                },
                cancelAuthModal() {
                    this.showAuthModal = false;
                },
                lockManagerMode() {
                    this.role = 'employee';
                    alert('Admin session cleared.');
                },

                // ROSTER SYSTEMS
                addEmployee() {
                    if (!this.newEmployeeName.trim()) return;
                    this.employees.push({ id: Date.now(), name: this.newEmployeeName.trim() });
                    this.saveEmployees();
                    this.newEmployeeName = '';
                },
                removeEmployee(id) {
                    this.employees = this.employees.filter(e => e.id !== id);
                    this.saveEmployees();
                },

                // CALENDAR CONTEXT ENGINE
                shiftWeek(days) {
                    this.weekOffset += days;
                    const baseDate = new Date();
                    baseDate.setDate(baseDate.getDate() + this.weekOffset);
                    this.selectedDate = baseDate.toISOString().split('T')[0];
                },
                getWeekRangeLabel() {
                    const firstDay = new Date(); firstDay.setDate(firstDay.getDate() + this.weekOffset);
                    const lastDay = new Date(); lastDay.setDate(lastDay.getDate() + this.weekOffset + 6);
                    return firstDay.toLocaleDateString('en-US', {month:'short', day:'numeric'}) + ' - ' + lastDay.toLocaleDateString('en-US', {month:'short', day:'numeric'});
                },
                get weekDays() {
                    const days = [];
                    for (let i = 0; i < 7; i++) {
                        const d = new Date();
                        d.setDate(d.getDate() + this.weekOffset + i);
                        days.push({ name: d.toLocaleDateString('en-US', { weekday: 'short' }), dayNum: d.getDate(), dateStr: d.toISOString().split('T')[0] });
                    }
                    return days;
                },

                get filteredShifts() {
                    return this.shifts.filter(s => s.date === this.selectedDate && s.location === this.currentLocation);
                },
                get pendingRequests() {
                    return this.leaveRequests.filter(r => r.status === 'Pending');
                },

                // BUSINESS OPERATIONS ENGINE
                submitLeaveRequest() {
                    if (!this.selectedEmployeeForRequest) return alert('Identify your name target profile.');
                    if (!this.newRequestDate) return alert('Input valid target date.');

                    this.leaveRequests.push({
                        id: Date.now(),
                        employeeName: this.selectedEmployeeForRequest,
                        date: this.newRequestDate,
                        note: this.newRequestNote || 'General Absence Request',
                        location: this.currentLocation,
                        status: 'Pending'
                    });
                    this.saveLeave();
                    alert('Request safely committed to pending execution timeline!');
                    this.newRequestDate = ''; this.newRequestNote = '';
                },
                createCustomShift() {
                    if (!this.mngEmpName || !this.mngRole || !this.mngTime || !this.mngDate) return alert('Please completely satisfy all shift layout parameters.');
                    
                    this.shifts.push({ id: Date.now(), employeeName: this.mngEmpName, role: this.mngRole, time: this.mngTime, date: this.mngDate, location: this.currentLocation });
                    this.saveShifts();
                    alert('Shift saved successfully!');
                    this.mngEmpName = ''; this.mngRole = ''; this.mngTime = '';
                },
                resolveRequest(requestId, decision) {
                    const target = this.leaveRequests.find(r => r.id === requestId);
                    if (target) {
                        target.status = decision;
                        if (decision === 'Approved') {
                            this.shifts.push({ id: Date.now(), employeeName: target.employeeName, date: target.date, role: '❌ APPROVED LEAVE', time: 'Unavailable', location: target.location });
                            this.saveShifts();
                        }
                        this.saveLeave();
                    }
                },
                formatDisplayDate(dateStr) {
                    if (!dateStr) return '';
                    const parts = dateStr.split('-');
                    return new Date(parts[0], parts[1] - 1, parts[2]).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                }
            }
        }
    </script>
</body>
</html>
